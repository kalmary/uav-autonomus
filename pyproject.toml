[project]
name = "uav-autonomus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "jsbsim>=1.3.3,<2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "skrl>=2.1.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0,<2.12",
]
cuda = [
    "torch>=2.11.0,<2.12; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
test = [
    "pytest>=9.1.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
