[project]
name = "uav-autonomus"
version = "0.1.0"
description = "Hybrid global and local horizontal UAV path planning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.7,<4",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
uav-planner = "src.__main__:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
test = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
